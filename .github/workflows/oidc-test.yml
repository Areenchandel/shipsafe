name: oidc-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            account: "368838190652"
          - env: staging
            account: "243054644279"
          - env: prod
            account: "173149129548"
    steps:
      - name: Show OIDC token claims (debug)
        uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const p = JSON.parse(Buffer.from(t.split('.')[1], 'base64').toString());
            core.info(`sub = ${p.sub}`);
            core.info(`aud = ${p.aud}`);

      - name: Login to management (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190335339393:role/shipsafe-github-actions
          aws-region: ap-south-1

      - name: Who am I (hub)
        run: aws sts get-caller-identity

      - name: Hop into ${{ matrix.env }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account }}:role/shipsafe-deploy
          aws-region: ap-south-1
          role-chaining: true

      - name: Who am I (${{ matrix.env }})
        run: aws sts get-caller-identity
